[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aries-os"
version = "0.1.0"
description = "Sistema Operativo IA Personal"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [{name = "Aries OS"}]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.113.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0",
    "redis>=5.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.1",
    "loguru>=0.7.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "httpx>=0.27.0",
    "click>=8.1",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.22",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.1",
    "mypy>=1.9",
    "isort>=5.13",
    "mkdocs>=1.5",
    "mkdocs-material>=10.0",
    "bandit>=1.8",
    "safety>=2.0",
    "pre-commit>=3.5",
]

voice = [
    "pydub>=0.25",
    "SpeechRecognition>=3.9",
    "piper-tts>=1.2",
    "faster-whisper>=0.10",
]

desktop = [
    "pyside6>=6.6",
    "qt-material>=2.14",
]

docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=10.0",
    "mkdocstrings[python]>=0.24",
]

[project.urls]
Homepage = "https://github.com/oropezadev/aries-os"
Repository = "https://github.com/oropezadev/aries-os.git"
Issues = "https://github.com/oropezadev/aries-os/issues"

[project.scripts]
aries = "aries.__main__:run"
aries-api = "aries.__main__:run"
aries-desktop = "aries.__main__:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | env
  | venv
)/
'''

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "I", "W", "B", "C", "UP"]
ignore = ["E501", "B008"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "build",
    "dist",
    ".tox",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["F401", "F811"]

[tool.ruff.isort]
known-first-party = ["aries"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_no_return = true
strict_optional = true

[[tool.mypy.overrides]]
module = ["pyside6.*", "faster_whisper.*", "pydub.*"]
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["aries"]
skip_gitignore = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src/aries"]
branch = true
omit = ["*/tests/*", "*/test_*.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*Protocol.*:",
    "@abstractmethod",
]
precision = 2